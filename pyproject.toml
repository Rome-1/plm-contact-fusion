[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "plm-contact-fusion"
version = "0.1.0"
description = "Top-K attention-head fusion for unsupervised protein contact prediction: reading contacts from a PLM in one forward pass, beating the Categorical Jacobian (Zhang 2024)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Rome Thorstenson" },
]
keywords = [
    "protein-language-models",
    "mech-interp",
    "contact-prediction",
    "categorical-jacobian",
    "attention",
    "esm-2",
]

# Runtime dependencies. Loose bounds here; requirements.lock pins exact
# versions for reproducibility.
dependencies = [
    "torch>=2.3,<3",
    "transformers>=4.40",
    "tokenizers>=0.19",
    "huggingface_hub>=0.20",
    "safetensors>=0.4",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "biopython>=1.83",
    "tqdm>=4.66",
    "pydantic>=2.7",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests",
    "types-PyYAML",
]
figures = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.urls]
Homepage = "https://github.com/Rome-1/plm-contact-fusion"

[tool.hatch.build.targets.wheel]
packages = ["src/sj", "src/baselines"]

[tool.hatch.build.targets.sdist]
include = ["src", "scripts", "checkpoints", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter; keeps tables/comments breathable
    # Greek letters (alpha/beta/lambda), multiplication sign, em-dashes, etc.
    # appear intentionally throughout this scientific codebase's strings,
    # docstrings, and comments. Do not "de-unicode" the math notation.
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "gpu: requires CUDA GPU (skipped in default CI)",
    "integration: end-to-end test, may be slow (skipped in default CI)",
]
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:torch.*",
    "ignore::DeprecationWarning:transformers.*",
]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src"]
